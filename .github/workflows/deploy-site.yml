# Publica o site no GitHub Pages a cada push na branch main.
# A URL do Apps Script fica em web/.env.production. Para trocá-la sem commit,
# crie a variável VITE_API_URL em Settings > Secrets and variables > Actions > Variables.
# Settings > Pages > Source = "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
    paths: ['web/**', 'apps-script/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          API_URL_OVERRIDE: ${{ vars.VITE_API_URL }}
        run: |
          if [ -n "$API_URL_OVERRIDE" ]; then export VITE_API_URL="$API_URL_OVERRIDE"; fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
